<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  </head>
  <body onload="main()">


    Neel Walse
    <br>
    nwalse@ucsc.edu

    <div class="segment">
      <div class="segment" id="display-container">
        <canvas id="webgl" width="800" height="400">
          Please use a browser that supports "canvas"
        </canvas>
    </div>

    Light position
    <br>
    X: <input type="range" min="-400" max="400" value="0" class="slider" id="light-x">
    <br>
    Y: <input type="range" min="-100" max="700" value="200" class="slider" id="light-y">
    <br>
    Z: <input type="range" min="-400" max="400" value="0" class="slider" id="light-z">
    <br>
    <br>
    Ambient Level: <input type="range" min="0" max="1" value="0.65" step="0.05" class="slider" id="ambient-level">
    <br>
    Specular Coefficient: <input type="range" min="0" max="100" value="30.0" step="1" class="slider" id="specular-level">
    <br>
    Specular Color: <input type="color" id="specular-color">
    <br>
    Diffuse Color: <input type="color" id="diffuse-color">
    <br>
    Ambient Color: <input type="color" id="ambient-color">

    <br>
    <input type="button" value="Normals On" onclick="g_normalOn = true">
    <input type="button" value="Normals Off" onclick="g_normalOn = false">
    <br>
    <br>
    <input type="button" value="Lights On" onclick="g_lightOn = true">
    <input type="button" value="Lights Off" onclick="g_lightOn = false">
    <br>
    <br>
    <input type="button" value="Spotlight On" onclick="g_spotlight.active = true">
    <input type="button" value="Spotlight Off" onclick="g_spotlight.active = false">
    <br>
    <br>
      
    </div>
    <br>
    <div class="segment" id="performance-display"></div>
    <br>

    <script src="../lib/webgl-utils.js"></script>
    <script src="../lib/webgl-debug.js"></script>
    <script src="../lib/cuon-utils.js"></script>
    <script src="../lib/cuon-matrix-cse160.js"></script>
    <script src="Triangle.js"></script>
    <script src="Circle.js"></script>
    <script src="Cube.js"></script>
    <script src="Sphere.js"></script>
    <script src="Camera.js"></script>
    <script src="world.js"></script>
    <script src="BlockyWorld.js"></script>

  </body>
</html>
